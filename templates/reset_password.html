
{% extends "base.html" %}

{% block title %}
Reset Password | Forex Trading Journal
{% endblock %}

{% block content %}

<section class="form-section auth-section">

    <h2>Reset Your Password</h2>

    <p class="auth-description">
        Enter the recovery code sent to your email and choose a new password.
    </p>

    <form method="POST" action="{{ url_for('reset_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">

            <label for="otp">Recovery Code</label>

            <input
                type="text"
                id="otp"
                name="otp"
                placeholder="Enter your 6-digit code"
                maxlength="6"
                inputmode="numeric"
                autocomplete="one-time-code"
                required
            >

        </div>

        <div class="form-group">

            <label for="password">New Password</label>

            <div class="password-input-wrapper">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your new password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    data-target="password"
                    aria-label="Show password"
                    title="Show password"
                >
                    <svg class="password-eye-icon eye" viewBox="0 0 24 24">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>

                    <svg class="password-eye-icon eye-off" viewBox="0 0 24 24">
                        <path d="m3 3 18 18"/>
                        <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
                        <path d="M9.9 5.2A11 11 0 0 1 12 5c6.5 0 10 7 10 7a14 14 0 0 1-3 3.8"/>
                        <path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7a10 10 0 0 0 4-.8"/>
                    </svg>
                </button>

            </div>

        </div>

        <div class="form-group">

            <label for="confirm_password">Confirm New Password</label>

            <div class="password-input-wrapper">

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your new password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    data-target="confirm_password"
                    aria-label="Show password"
                    title="Show password"
                >
                    <svg class="eye" viewBox="0 0 24 24">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>

                    <svg class="eye-off" viewBox="0 0 24 24">
                        <path d="m3 3 18 18"/>
                        <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
                        <path d="M9.9 5.2A11 11 0 0 1 12 5c6.5 0 10 7 10 7a14 14 0 0 1-3 3.8"/>
                        <path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7a10 10 0 0 0 4-.8"/>
                    </svg>
                </button>

            </div>

        </div>

        <button type="submit">
            Reset Password
        </button>

    </form>

    <p class="auth-links">
        <a href="{{ url_for('login') }}">Return to login</a>
    </p>

</section>

{% endblock %}
