
{% extends "base.html" %}

{% block title %}
Login | Forex Trading Journal
{% endblock %}

{% block content %}

<section class="form-section auth-section">

    <h2>Welcome Back</h2>

    <p class="auth-description">
        Log in to access your personal Forex Trading Journal.
    </p>

    <form method="POST" action="{{ url_for('login') }}">
         <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
                required
                maxlength="255"
                autocomplete="email"
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <div class="password-input-wrapper">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >

                <button
                    type="button"
                    class="password-toggle"
                    data-target="password"
                    aria-label="Show password"
                    title="Show password"
                >
                    <svg class="password-eye-icon eye" viewBox="0 0 24 24">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>

                    <svg class="password-eye-icon eye-off" viewBox="0 0 24 24">
                        <path d="m3 3 18 18"/>
                        <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
                        <path d="M9.9 5.2A11 11 0 0 1 12 5c6.5 0 10 7 10 7a14 14 0 0 1-3 3.8"/>
                        <path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7a10 10 0 0 0 4-.8"/>
                    </svg>
                </button>

            </div>
        </div>

        <p class="auth-links">
            <a href="{{ url_for('forgot_password') }}">
                Forgot your password?
            </a>
        </p>

        <button type="submit">Log In</button>

    </form>
    <div class="google-login-section">

    <p>Or continue with</p>

    <a href="{{ url_for('google_login') }}" class="google-login-button">

        <img
            src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
            alt="Google logo"
        >

        Continue with Google

    </a>

</div>

    <p class="auth-links">
        Don't have an account?
        <a href="{{ url_for('register') }}">Create an account</a>
    </p>

</section>

{% endblock %}
